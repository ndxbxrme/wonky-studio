<main class="mask-editor-page" data-mask-editor-page>
  {{#if editorReady}}
    <header class="mask-editor-header">
      <div>
        <h1>{{object.name}}</h1>
        <p class="mask-editor-header__meta" data-mask-editor-frame-meta></p>
        <p class="mask-editor-header__file" data-mask-editor-frame-file>{{currentMask.original_filename}}</p>
        <p class="mask-editor-header__note" data-mask-editor-frame-note hidden></p>
      </div>
      <div class="mask-editor-header__actions">
        <a class="back-link" href="/scene/{{scene.id}}">Scene {{scene.id}}</a>
        <a class="button secondary compact" href="/animations/{{scene.id}}/{{object.id}}">Open animation editor</a>
        <p class="form-status" data-editor-status aria-live="polite"></p>
      </div>
    </header>
    <wonky-mask-editor></wonky-mask-editor>
  {{/if}}

  {{#if editorMissing}}
    <section class="empty-state">
      <p>Mask frame not found.</p>
      <a class="button secondary" href="/">Back to scenes</a>
    </section>
  {{/if}}
</main>
